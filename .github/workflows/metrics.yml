
name: GitHub Profile Metrics

on:
  schedule:
    - cron: "30 19 * * 1"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      # Generate general GitHub statistics
      - name: Generate general statistics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-stats.svg

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member

          config_timezone: America/Mexico_City

      # Generate programming languages statistics
      - name: Generate programming languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: github-languages.svg

          base: ""
          repositories: 100
          repositories_affiliations: owner, collaborator, organization_member

          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%

          config_timezone: America/Mexico_City
